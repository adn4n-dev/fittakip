name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını hazırla
        env:
          KS_B64: ${{ secrets.FITTAKIP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/fittakip.jks"
            echo "FITTAKIP_KEYSTORE=$RUNNER_TEMP/fittakip.jks" >> "$GITHUB_ENV"
          fi

      - name: APK derle
        env:
          FITTAKIP_KEYSTORE_PASSWORD: ${{ secrets.FITTAKIP_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: İmzayı göster
        run: |
          if [ -n "$FITTAKIP_KEYSTORE" ]; then echo "Sabit anahtar: VAR"; else echo "Sabit anahtar: YOK (secret eklenmemiş)"; fi
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $AS verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: FitTakip-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Testleri çalıştır
        env:
          FITTAKIP_KEYSTORE_PASSWORD: ${{ secrets.FITTAKIP_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest
